<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    .parentDiv {
      width: 100vw;
      height: 100vh;
      background-color: ghostwhite;
      display: grid;
      place-content: center;
    }
  </style>

  <body style="box-sizing: border-box">
    <div class="parentDiv">
      <div class="KeyContainer" style="background-color: rgb(255, 255, 255)">
        <h1
          style="
            width: 20vw;
            height: 20vh;
            border: 1px solid black;
            color: red;
            text-align: center;
            font-size: 20px;
            overflow-wrap: break-word;
          "
        ></h1>
      </div>
    </div>

    <script>
      let keyPressed = document.querySelector("h1");
      let keys = " ";

      window.addEventListener("keydown", (key2) => {
        console.log(key2);
        if (key2.key == "Backspace") {
          keys = keys.slice(0, -1);
          console.log(keys);
          keyPressed.textContent = keys;
        } else {
          keys += key2.key;
          keyPressed.textContent = keys;
          console.log(`here is ${keys}`);
          console.dir(keys);
        }
      });
    </script>
  </body>
</html>
