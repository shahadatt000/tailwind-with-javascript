<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    * {
      margin: 0px;
      padding: 0px;
      box-sizing: border-box;
    }
    .parentDiv {
      width: 100vw;
      height: 100vh;
      background-color: ghostwhite;
      display: grid;
      place-content: center;
    }
    .KeyContainer {
      border: 5px solid transparent; /* Set a transparent border */
      border-image: linear-gradient(
        to right,
        red,
        orange,
        yellow,
        green,
        blue,
        indigo,
        violet
      );
      border-image-slice: 1; /* Ensure the entire image is used for the border */
    }
    h1 {
      border: 5px solid transparent; /* Set a transparent border */
      border-image: linear-gradient(
        to right,
        red,
        orange,
        yellow,
        green,
        blue,
        indigo,
        violet
      );
      border-image-slice: 1; /* Ensure the entire image is used for the border */
      padding: 0px;
      margin: 0px;
    }
  </style>

  <body style="box-sizing: border-box">
    <div class="parentDiv">
      <div
        class="KeyContainer"
        style="
          background-color: rgb(67, 221, 1);
          display: grid;
          place-content: center;
        "
      >
        <h1
          style="
            width: 20vw;
            height: 20vh;
            border: 1px solid rgb(186, 13, 13);
            color: red;
            text-align: center;
            font-size: 2rem
            overflow-wrap: break-word;
            background-color:yellow;
          "
        ></h1>
      </div>
    </div>

    <script>
      let keyPressed = document.querySelector("h1");
      let keys = " ";

      window.addEventListener("keydown", (key2) => {
        console.log(key2);
        if (key2.key == "Backspace") {
          keys = keys.slice(0, -1);
          console.log(keys);
          keyPressed.textContent = keys;
        } else {
          keys += key2.key;
          keyPressed.textContent = keys;
          console.log(`here is ${keys}`);
          console.dir(keys);
        }
      });
    </script>
  </body>
</html>
