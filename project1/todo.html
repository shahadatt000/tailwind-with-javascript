<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To do App</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body
    class=".box-border bg-gradient-to-r from-fuchsia-500 to-cyan-500 font-sans"
  >
    <!-- -------------------------- middle parent div -------------------------- -->
    <section class="w-screen h-20 mx-auto">
      <!-- input menu -->
      <header
        class="w-[40vw] h-20 bg-white/40 backdrop-blur-sm pe-5 rounded-md flex items-center shadow-md mt-50 mx-auto"
      >
        <input
          type="text"
          class="bg-white w-[80%] m-5 h-10 rounded-md p-2 border-1 border-stone-400"
          placeholder="what need to do"
        />
        <button
          class="bg-blue-700 rounded-md p-2 px-6 cursor-pointer text-white font-sans cursor-pointer"
        >
          <i class="fa-solid fa-circle-plus"></i>
        </button>
      </header>
      <!-- input menu end -->

      <!-- ------------------------------ section 2 ------------------------------ -->

      <div class="todoLists"></div>
    </section>
    <script src="todoscript.js"></script>
  </body>
</html>
