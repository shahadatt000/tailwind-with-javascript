<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>timer</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div
      class="parentContainer bg-white h-screen w-screen flex justify-center items-center"
    >
      <div
        class="middleContainer bg-blue-600 w-50 h-50 rounded-lg flex justify-center flex-col items-center text-white font-bold gap-3 uppercase"
      >
        <h1 class="text-4xl countDown">00:00:00</h1>
        <div class="flex gap-3 text-green-200">
          <div>stop</div>
          <div
            class="start hover:scale-110 hover:text-black transition duration-300 cursor-pointer"
            onclick="StartCountDown()"
          >
            start
          </div>
          <div
            class="hover:text-black transition duration-300 cursor-pointer"
            onclick="reset()"
          >
            stop
          </div>
        </div>
        <p>this is the timer</p>
      </div>
    </div>
    <script>
      let countDown = document.querySelector(".countDown");
      let [hour, minute, seconds] = [0, 0, 0];
      let interval;

      function StartCountDown() {
        interval = setInterval(() => {
          ++seconds;
          let s = seconds < 10 ? `0 ${seconds}` : seconds;
          let m = minute < 10 ? "0" + minute : minute;
          let h = hour < 10 ? "0" + hour : hour;
          countDown.innerHTML = `${h} : ${m} : ${s}`;

          if (seconds === 60) {
            seconds = 0;
            minute++;
            if (minute === 3) {
              minute = 0;
              hour++;
            }
          }
        }, 1000);
      }
      function reset() {
        clearInterval(interval);
        [hour, minute, seconds] = [0, 0, 0];
        countDown.innerHTML = `${hour} : ${minute} : ${seconds}`;
      }
    </script>
  </body>
</html>
